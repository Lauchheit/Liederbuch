<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corda – Songs durchstöbern</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<div id="page-body">
  <div id="song-browser">
    <h1>Songs durchstöbern</h1>
    <input type="search" id="song-search" class="song-search" placeholder="Suche nach Titel oder Interpret...">
    <ul id="public-song-list" class="song-row-list"><li class="empty">lade...</li></ul>
  </div>
  <div id="cart-widget" class="cart-panel"></div>
</div>

<script src="common.js"></script>
<script>
let publicSongs = []; // gruppiert nach (title, artist), je eine "Song-Familie"
let searchDebounce = null;

// Serverseitige Suche (nicht nur Client-Filter): ohne Suchbegriff werden nur
// die Top-20-Songs geladen, ein Client-Filter darueber wuerde Treffer jenseits
// der ersten 20 gar nicht erst finden koennen.
async function loadPublicSongs(query) {
  const listEl = document.getElementById("public-song-list");
  try {
    const res = await apiFetch(`/api/public-songs?q=${encodeURIComponent(query)}`);
    if (!res.ok) {
      listEl.innerHTML = '<li class="empty">Fehler beim Laden</li>';
      return;
    }
    publicSongs = await res.json();
    renderPublicSongList(query);
  } catch (e) {
    // 401 wird schon von apiFetch behandelt (Auth-Overlay)
  }
}

function renderPublicSongList(query) {
  const listEl = document.getElementById("public-song-list");

  listEl.innerHTML = "";
  if (publicSongs.length === 0) {
    listEl.innerHTML = query
      ? '<li class="empty">Keine Treffer</li>'
      : '<li class="empty">Noch keine veröffentlichten Songs</li>';
    return;
  }

  for (const song of publicSongs) {
    const li = document.createElement("li");
    li.innerHTML = `
      <div class="song-text clickable">
        <div class="song-title"></div>
        <div class="song-artist"></div>
      </div>
      <a class="btn-link versions-link">Versionen (${song.version_count})</a>`;
    li.querySelector(".song-title").textContent = song.title;
    li.querySelector(".song-artist").textContent = song.artist || "";
    li.querySelector(".versions-link").href =
      `versions.html?title=${encodeURIComponent(song.title)}&artist=${encodeURIComponent(song.artist || "")}`;
    li.querySelector(".song-text").addEventListener("click", () => previewTopVersion(song));
    listEl.appendChild(li);
  }
}

// Song-Familie -> die Version mit dem höchsten Score (song-versions liefert
// bereits nach Score absteigend sortiert). Nur fuer die Vorschau beim Klick auf
// die Songzeile - bewusst KEIN "+ Liederbuch" hier: das wuerde die Top-Version
// systematisch bevorzugen (mehr Speicherungen -> mehr Score -> immer noch mehr
// Speicherungen). Liederbuch-Zuordnung passiert gezielt auf der Versionen-Seite.
async function resolveTopVersion(song) {
  try {
    const res = await apiFetch(
      `/api/song-versions?title=${encodeURIComponent(song.title)}&artist=${encodeURIComponent(song.artist || "")}`
    );
    if (!res.ok) return null;
    const versions = await res.json();
    return versions.length ? versions[0] : null;
  } catch (e) {
    return null; // 401 -> Auth-Overlay wurde schon gezeigt
  }
}

async function previewTopVersion(song) {
  const top = await resolveTopVersion(song);
  if (!top) return;
  try {
    const renderRes = await apiFetch("/api/render-book", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ song_ids: [top.id] }),
    });
    if (!renderRes.ok) return;
    const blob = await renderRes.blob();
    const title = top.subtitle ? `${top.title} – ${top.subtitle}` : top.title;
    showPdfOverlay(blob, title);
  } catch (e) {
    // 401 -> Auth-Overlay wurde schon gezeigt
  }
}

document.getElementById("song-search").addEventListener("input", (e) => {
  clearTimeout(searchDebounce);
  const query = e.target.value.trim();
  searchDebounce = setTimeout(() => loadPublicSongs(query), 300);
});

initAuth(() => {
  loadPublicSongs("");
  loadBooks();
});
</script>
</body>
</html>
